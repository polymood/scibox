[package]
name = "scibox-gui"
description = "scibox with a GUI (egui + wgpu): unit converter, formula solver, graph plotter, and scientific calculator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.37.0"
latex-rust = { version = "2.1.1", default-features = false, features = ["std", "png"] }
scibox-core = { path = "../scibox-core" }
tiny-skia = "0.11"
